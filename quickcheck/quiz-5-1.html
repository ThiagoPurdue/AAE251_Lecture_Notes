s=\"sr-only\">&nbsp;<\/span><\/sub> stays the same and <i>V<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>TR,min<span class=\"sr-only\">&nbsp;<\/span><\/sub> drops to half"], "explanation": "Minimum thrust required <i>T<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>R,min<span class=\"sr-only\">&nbsp;<\/span><\/sub> = <i>mg<\/i>/(<i>L<\/i>/<i>D<\/i>)<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>max<span class=\"sr-only\">&nbsp;<\/span><\/sub> does not depend on air density, so it stays unchanged. Minimum-thrust speed scales as 1/√<i>ρ<\/i>, so cutting density by 4 multiplies <i>V<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>TR,min<span class=\"sr-only\">&nbsp;<\/span><\/sub> by √4 = 2."}, {"page": "thrust-and-power", "pageTitle": "5.1 Thrust and Power", "section": "Effect of altitude", "anchor": "p51-altitude", "question": "For the same climb at constant weight to an altitude where <i>ρ<\/i> = <i>ρ<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>0<span class=\"sr-only\">&nbsp;<\/span><\/sub>/4, how does the minimum power required <i>P<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>R,min<span class=\"sr-only\">&nbsp;<\/span><\/sub> change?", "options": ["It doubles, because <i>P<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>R,min<span class=\"sr-only\">&nbsp;<\/span><\/sub> scales as <i>ρ<\/i><sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>−1/2<\/sup>", "It stays the same, just like <i>T<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>R,min<span class=\"sr-only\">&nbsp;<\/span><\/sub>", "It drops to half, because air resistance is lower in thin air", "It increases by a factor of four"], "explanation": "Because <i>P<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>R<span class=\"sr-only\">&nbsp;<\/span><\/sub> = <i>T<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>R<span class=\"sr-only\">&nbsp;<\/span><\/sub> <i>V<\/i>, keeping the same thrust at twice the true airspeed doubles the power required: <i>P<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>R,min<span class=\"sr-only\">&nbsp;<\/span><\/sub> ∝ 1/√<i>ρ<\/i>, so √4 = 2. Minimum thrust stays constant, not minimum power; thinner air requires a faster true airspeed to hold lift, which raises <i>P<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>R,min<span class=\"sr-only\">&nbsp;<\/span><\/sub>."}]}</script>
<script>
(function () {
  // In a page, follow the page's theme; opened on its own, follow the reader's setting.
  function syncTheme() {
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (window.parent !== window) {
      try { dark = window.parent.document.documentElement.classList.contains("dark"); } catch (e) {}
    }
    document.documentElement.classList.toggle("dark", dark);
  }
  syncTheme();
  try { new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true }); } catch (e) {}
  function fit() {
    try {
      var fe = window.frameElement;
      if (fe && fe.parentElement) fe.parentElement.style.height = (Math.ceil(document.body.getBoundingClientRect().height) + 2) + "px";
    } catch (e) {}
  }
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {}
  window.addEventListener("load", fit);

  var Q = JSON.parse(document.getElementById("data").textContent).questions;
  var n = Q.length, i = 0, answered = false, right = [];
  var el = {};
  ["progress", "fill", "quiz", "legend", "opts", "feedback", "go", "result", "score", "reviewIntro", "review", "again"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function shuffle(a) {
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  // Show question i. The options are drawn in a new order each time; option 0 is the correct one.
  function show(moveFocus) {
    var q = Q[i];
    answered = false;
    el.progress.textContent = "Question " + (i + 1) + " of " + n;
    el.fill.style.width = (100 * i / n) + "%";
    el.legend.innerHTML = '<span class="sr-only">Question ' + (i + 1) + " of " + n + ": </span>" + q.question;
    el.opts.innerHTML = "";
    el.opts.className = "";
    shuffle([0, 1, 2, 3]).forEach(function (k) {
      var label = document.createElement("label"), input = document.createElement("input"),
          text = document.createElement("span"), tag = document.createElement("span");
      label.className = "opt";
      input.type = "radio"; input.name = "answer"; input.value = String(k);
      text.className = "text"; text.innerHTML = q.options[k];
      tag.className = "tag";
      label.appendChild(input); label.appendChild(text); label.appendChild(tag);
      el.opts.appendChild(label);
    });
    el.feedback.className = "feedback";
    el.feedback.textContent = "";
    el.go.textContent = "Check answer";
    el.result.hidden = true;
    el.quiz.hidden = false;
    el.progress.setAttribute("aria-hidden", "true");
    if (moveFocus) el.legend.focus();
  }

  function check() {
    var chosen = el.quiz.querySelector("input[name=answer]:checked");
    if (!chosen) {
      el.feedback.className = "feedback show";
      el.feedback.textContent = "Choose an answer first.";
      return;
    }
    answered = true;
    right[i] = chosen.value === "0";
    Array.prototype.forEach.call(el.opts.querySelectorAll("label"), function (label) {
      var input = label.querySelector("input"), tag = label.querySelector(".tag");
      if (input.value === "0") { label.classList.add("right"); tag.textContent = "✓ correct answer"; }
      else if (input.checked) { label.classList.add("wrong"); tag.textContent = "✗ your answer"; }
      input.disabled = true;
    });
    el.opts.className = "locked";
    el.feedback.className = "feedback show";
    el.feedback.innerHTML = '<span class="verdict ' + (right[i] ? "ok" : "bad") + '">' +
      (right[i] ? "Correct." : "Not correct.") + "</span> " + Q[i].explanation;
    el.go.textContent = i + 1 < n ? "Next question" : "See your score";
    el.go.focus();
  }

  function finish() {
    var count = right.filter(Boolean).length;
    el.progress.textContent = "Result";
    el.progress.removeAttribute("aria-hidden");
    el.fill.style.width = "100%";
    el.score.textContent = count === n ? "All " + n + " correct." : count + " of " + n + " correct.";
    el.review.innerHTML = "";
    el.reviewIntro.hidden = count === n;
    el.review.hidden = count === n;
    // Each link opens its section; the page name follows in parentheses.
    Q.forEach(function (q, j) {
      if (right[j]) return;
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "../" + q.page + "#" + q.anchor; a.target = "_top"; a.textContent = q.section;
      // On the quiz's own page, scroll to the section and move focus there, without
      // reloading the page (which would also reset the quiz).
      a.addEventListener("click", function (e) {
        try {
          var top = window.top, here = top.location.pathname.replace(/\/$/, ""),
              there = new URL(a.href).pathname.replace(/\/$/, "");
          if (here !== there) return;
          var target = top.document.getElementById(q.anchor);
          if (!target) return;
          e.preventDefault();
          top.history.pushState(null, "", "#" + q.anchor);
          target.scrollIntoView();
          // Focus the heading's text, not the heading: the heading also holds the
          // pilcrow link, whose label a screen reader would read with it.
          var spot = target.querySelector(".heading-text") || target;
          if (!spot.hasAttribute("tabindex")) spot.setAttribute("tabindex", "-1");
          spot.focus({ preventScroll: true });
        } catch (err) {}
      });
      li.appendChild(document.createTextNode("Question " + (j + 1) + ": "));
      li.appendChild(a);
      li.appendChild(document.createTextNode(" (" + q.pageTitle + ")"));
      el.review.appendChild(li);
    });
    el.quiz.hidden = true;
    el.result.hidden = false;
    el.score.focus();
  }

  el.quiz.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!answered) { check(); return; }
    i++;
    if (i < n) show(true); else finish();
  });
  el.again.addEventListener("click", function () { i = 0; right = []; show(true); });
  show(false);
})();
</script>
</body>
</html>
