<style>

lass=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>e<span class=\"sr-only\">&nbsp;<\/span><\/sub><\/i> − <i>p<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>a<span class=\"sr-only\">&nbsp;<\/span><\/sub><\/i>)<i>A<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>e<span class=\"sr-only\">&nbsp;<\/span><\/sub><\/i> = (60,000 − 100,000) × 0.5 = −20,000 N, negative because the exit pressure is below the ambient one. +20,000 N swaps the two pressures, −20 N uses kilopascals, and +30,000 N forgets the ambient pressure."}, {"page": "thrust-and-specific-impulse", "pageTitle": "4.1 Thrust and Specific Impulse", "section": "Effective exhaust velocity and specific impulse", "anchor": "p41-specific-impulse", "question": "A lander engine fires on the Moon with an effective exhaust velocity of 3,200 m/s. What is its specific impulse?", "options": ["326.2 s, using 9.81 m/s<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>2<\/sup> as on any other body", "3,200 s, since specific impulse is the exhaust velocity", "31,390 s, from the exhaust velocity times standard gravity", "More than 326.2 s, using the weaker gravity of the Moon"], "explanation": "<i>I<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>sp<span class=\"sr-only\">&nbsp;<\/span><\/sub> = <i>c<\/i>/<i>g<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>0<span class=\"sr-only\">&nbsp;<\/span><\/sub> = 3,200/9.81 = 326.2 s. Standard gravity is a fixed conversion number, the same on the Moon, so the same engine has the same specific impulse everywhere. Specific impulse is in seconds, not a velocity, and multiplying by <i>g<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>0<span class=\"sr-only\">&nbsp;<\/span><\/sub> goes the wrong way."}, {"page": "thrust-and-specific-impulse", "pageTitle": "4.1 Thrust and Specific Impulse", "section": "Overexpanded, underexpanded, ideally expanded", "anchor": "p41-expansion", "question": "High in the climb, a nozzle has an exit pressure of 30 kPa while the outside pressure is 20 kPa. How is it expanded, and what does its plume do?", "options": ["Underexpanded: the pressure term is positive and the plume spreads out", "Overexpanded: the pressure term is positive and the plume spreads out", "Underexpanded: the pressure term is negative and the plume narrows", "Ideally expanded: the exit and outside pressures are close enough"], "explanation": "With <i>p<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>e<span class=\"sr-only\">&nbsp;<\/span><\/sub><\/i> &gt; <i>p<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>a<span class=\"sr-only\">&nbsp;<\/span><\/sub><\/i> the nozzle did not expand the gas enough: it is underexpanded, the pressure term is positive, and the gas keeps expanding outside the exit, so the plume spreads. Overexpanded means <i>p<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>e<span class=\"sr-only\">&nbsp;<\/span><\/sub><\/i> &lt; <i>p<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>a<span class=\"sr-only\">&nbsp;<\/span><\/sub><\/i>."}, {"page": "thrust-and-specific-impulse", "pageTitle": "4.1 Thrust and Specific Impulse", "section": "Area ratio", "anchor": "p41-area-ratio", "question": "Why does an engine that fires only in vacuum carry a much larger nozzle than a first-stage engine?", "options": ["In vacuum a larger area ratio always raises the specific impulse", "In vacuum the gas must be slowed down before it leaves the nozzle", "A large nozzle raises the exit pressure, which helps in vacuum", "A large nozzle is needed to reach the speed of sound in vacuum"], "explanation": "A larger area ratio expands the gas further: lower exit pressure, higher exit speed. With no outside pressure there is nothing to overexpand against, so specific impulse keeps rising, and size and mass set the limit. A larger nozzle lowers the exit pressure, and the gas reaches the speed of sound at the throat in any case."}, {"page": "thrust-and-specific-impulse", "pageTitle": "4.1 Thrust and Specific Impulse", "section": "Thrust changes with altitude", "anchor": "thrust-changes-with-altitude", "question": "A first-stage engine with a fixed nozzle is ideally expanded at 11 km. How does its thrust change as the vehicle climbs from 11 km toward vacuum?", "options": ["It keeps rising, because the outside pressure keeps falling", "It falls, because the nozzle is no longer ideally expanded", "It stays the same, because the flow through the engine is fixed", "It falls, because there is less air for the exhaust to push on"], "explanation": "For a fixed nozzle, <i>F<\/i> = <i>F<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>vac<span class=\"sr-only\">&nbsp;<\/span><\/sub> − <i>p<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>a<span class=\"sr-only\">&nbsp;<\/span><\/sub>A<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>e<span class=\"sr-only\">&nbsp;<\/span><\/sub><\/i>: as the outside pressure falls, the thrust rises all the way to vacuum. Ideal expansion is the best nozzle for one outside pressure; it is not the altitude of highest thrust for a nozzle that already exists."}, {"page": "thrust-and-specific-impulse", "pageTitle": "4.1 Thrust and Specific Impulse", "section": "The same equation for an engine that breathes air", "anchor": "p41-air-breathing", "question": "A ramjet takes in 40 kg/s of air at 500 m/s and sends it out at 1,100 m/s, with the nozzle ideally expanded. What is its thrust?", "options": ["24,000 N", "44,000 N", "64,000 N", "20,000 N"], "explanation": "<i>F<\/i> = <i>ṁ<\/i>(<i>V<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>e<span class=\"sr-only\">&nbsp;<\/span><\/sub><\/i> − <i>V<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>∞<span class=\"sr-only\">&nbsp;<\/span><\/sub>) = 40 × (1,100 − 500) = 24,000 N; the pressure term is zero. 44,000 N leaves out the speed the air already had, 64,000 N adds it instead of subtracting it, and 20,000 N uses the incoming speed alone."}]}</script>
<script>
(function () {
  // In a page, follow the page's theme; opened on its own, follow the reader's setting.
  function syncTheme() {
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (window.parent !== window) {
      try { dark = window.parent.document.documentElement.classList.contains("dark"); } catch (e) {}
    }
    document.documentElement.classList.toggle("dark", dark);
  }
  syncTheme();
  try { new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true }); } catch (e) {}
  function fit() {
    try {
      var fe = window.frameElement;
      if (fe && fe.parentElement) fe.parentElement.style.height = (Math.ceil(document.body.getBoundingClientRect().height) + 2) + "px";
    } catch (e) {}
  }
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {}
  window.addEventListener("load", fit);

  var Q = JSON.parse(document.getElementById("data").textContent).questions;
  var n = Q.length, i = 0, answered = false, right = [];
  var el = {};
  ["progress", "fill", "quiz", "legend", "opts", "feedback", "go", "result", "score", "reviewIntro", "review", "again"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function shuffle(a) {
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  // Show question i. The options are drawn in a new order each time; option 0 is the correct one.
  function show(moveFocus) {
    var q = Q[i];
    answered = false;
    el.progress.textContent = "Question " + (i + 1) + " of " + n;
    el.fill.style.width = (100 * i / n) + "%";
    el.legend.innerHTML = '<span class="sr-only">Question ' + (i + 1) + " of " + n + ": </span>" + q.question;
    el.opts.innerHTML = "";
    el.opts.className = "";
    shuffle([0, 1, 2, 3]).forEach(function (k) {
      var label = document.createElement("label"), input = document.createElement("input"),
          text = document.createElement("span"), tag = document.createElement("span");
      label.className = "opt";
      input.type = "radio"; input.name = "answer"; input.value = String(k);
      text.className = "text"; text.innerHTML = q.options[k];
      tag.className = "tag";
      label.appendChild(input); label.appendChild(text); label.appendChild(tag);
      el.opts.appendChild(label);
    });
    el.feedback.className = "feedback";
    el.feedback.textContent = "";
    el.go.textContent = "Check answer";
    el.result.hidden = true;
    el.quiz.hidden = false;
    el.progress.setAttribute("aria-hidden", "true");
    if (moveFocus) el.legend.focus();
  }

  function check() {
    var chosen = el.quiz.querySelector("input[name=answer]:checked");
    if (!chosen) {
      el.feedback.className = "feedback show";
      el.feedback.textContent = "Choose an answer first.";
      return;
    }
    answered = true;
    right[i] = chosen.value === "0";
    Array.prototype.forEach.call(el.opts.querySelectorAll("label"), function (label) {
      var input = label.querySelector("input"), tag = label.querySelector(".tag");
      if (input.value === "0") { label.classList.add("right"); tag.textContent = "✓ correct answer"; }
      else if (input.checked) { label.classList.add("wrong"); tag.textContent = "✗ your answer"; }
      input.disabled = true;
    });
    el.opts.className = "locked";
    el.feedback.className = "feedback show";
    el.feedback.innerHTML = '<span class="verdict ' + (right[i] ? "ok" : "bad") + '">' +
      (right[i] ? "Correct." : "Not correct.") + "</span> " + Q[i].explanation;
    el.go.textContent = i + 1 < n ? "Next question" : "See your score";
    el.go.focus();
  }

  function finish() {
    var count = right.filter(Boolean).length;
    el.progress.textContent = "Result";
    el.progress.removeAttribute("aria-hidden");
    el.fill.style.width = "100%";
    el.score.textContent = count === n ? "All " + n + " correct." : count + " of " + n + " correct.";
    el.review.innerHTML = "";
    el.reviewIntro.hidden = count === n;
    el.review.hidden = count === n;
    // Each link opens its section; the page name follows in parentheses.
    Q.forEach(function (q, j) {
      if (right[j]) return;
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "../" + q.page + "#" + q.anchor; a.target = "_top"; a.textContent = q.section;
      // On the quiz's own page, scroll to the section and move focus there, without
      // reloading the page (which would also reset the quiz).
      a.addEventListener("click", function (e) {
        try {
          var top = window.top, here = top.location.pathname.replace(/\/$/, ""),
              there = new URL(a.href).pathname.replace(/\/$/, "");
          if (here !== there) return;
          var target = top.document.getElementById(q.anchor);
          if (!target) return;
          e.preventDefault();
          top.history.pushState(null, "", "#" + q.anchor);
          target.scrollIntoView();
          // Focus the heading's text, not the heading: the heading also holds the
          // pilcrow link, whose label a screen reader would read with it.
          var spot = target.querySelector(".heading-text") || target;
          if (!spot.hasAttribute("tabindex")) spot.setAttribute("tabindex", "-1");
          spot.focus({ preventScroll: true });
        } catch (err) {}
      });
      li.appendChild(document.createTextNode("Question " + (j + 1) + ": "));
      li.appendChild(a);
      li.appendChild(document.createTextNode(" (" + q.pageTitle + ")"));
      el.review.appendChild(li);
    });
    el.quiz.hidden = true;
    el.result.hidden = false;
    el.score.focus();
  }

  el.quiz.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!answered) { check(); return; }
    i++;
    if (i < n) show(true); else finish();
  });
  el.again.addEventListener("click", function () { i = 0; right = []; show(true); });
  show(false);
})();
</script>
