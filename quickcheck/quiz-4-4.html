<title>Quiz: Standard 4.4, Propellant Selection</title>
<style>
  /* The color variables match the quick checks (quickcheck/*.html). Change them together. */
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #4b5563; --card: #ffffff; --border: #d9d6ce;
    --head-bg: #f7f5f0; --head-fg: #111827; --accent: #6f5630; --accent-border: #cfb991;

  html.dark { color-scheme: dark; }   /* native radio buttons drawn for a dark page */

  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

         border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); cursor: pointer; }
  .opt input { flex: none; width: 1.05em; height: 1.05em; margin: 0.25em 0 0; accent-color: var(--button); }
  .opt .text { flex: 1 1 12em; }
  .opt .tag { flex: none; font-weight: 600; font-size: 0.92em; }
  .opt:hover { border-color: var(--fg); }
  .opt:has(input:checked) { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 1px; }
  .locked .opt { cursor: default; }
  .locked .opt:hover { border-color: var(--input-border); }
  .locked .opt.right, .locked .opt.right:hover { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
  .locked .opt.wrong, .locked .opt.wrong:hover { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
  .opt.right .tag { color: var(--ok); }
  .opt.wrong .tag { color: var(--bad); }
  .feedback { margin: 14px 0 0; }
  .feedback.show { border: 1px solid var(--border); border-left: 4px solid var(--accent-border); border-radius: 6px;
                   background: var(--sol-bg); padding: 10px 14px; }
  .verdict { font-weight: 700; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .buttons { display: flex; gap: 12px; margin: 16px 0 0; }
  button { font: inherit; font-weight: 600; padding: 9px 20px; border-radius: 6px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .primary { background: var(--button); color: var(--button-fg); border: 1px solid var(--button); }
  .score { margin: 0 0 8px; font-size: 1.15em; font-weight: 700; color: var(--head-fg); }
  .score:focus { outline: none; }
  .result p { margin: 8px 0; }
  .result ul { margin: 8px 0 0; padding-left: 1.3em; }
  .result li { margin: 4px 0; }
  a { color: var(--link); }
  a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>

<div class="card">
  <div class="head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M9 10l1.5 1.5L13.5 8.5M9 16h6"/></svg>

</div>
<script type="application/json" id="data">{"questions": [{"page": "propellant-selection", "pageTitle": "4.4 Propellant Selection", "section": "Two questions", "anchor": "two-questions", "question": "An electric thruster has a specific impulse of 2,400 s and a thrust of 0.04 N. A solid motor has a specific impulse of 260 s and a thrust of 380 kN. Which statement is right?", "options": ["The thruster uses its propellant far better; the motor pushes far harder", "The thruster pushes harder, because its specific impulse is higher", "The motor uses its propellant better, because its thrust is higher", "They cannot be compared, because specific impulse is a speed in m/s"], "explanation": "Specific impulse is the thrust each kilogram per second of propellant buys, so the thruster wastes far less propellant. Thrust is how hard an engine pushes, and the motor pushes millions of times harder. The two numbers measure different things, and specific impulse is in seconds, not m/s."}, {"page": "propellant-selection", "pageTitle": "4.4 Propellant Selection", "section": "Kinds of rocket propulsion", "anchor": "p44-kinds", "question": "The first stage of a launch vehicle must lift a 480 t vehicle off the pad. Which kinds of propulsion can do it?", "options": ["Chemical: solid motors or liquid bipropellant engines", "Electric, because it has the highest specific impulse", "Nuclear thermal, because it doubles the specific impulse of chemical rockets", "Cold gas, because it is the simplest and safest"], "explanation": "Only chemical rockets give a thrust greater than the weight of a launch vehicle. Electric thrusters give millinewtons, cold gas a few newtons, and the nuclear thermal engines tested on the ground gave at most about 1.1 MN, far below the 4.7 MN weight of 480 t. Specific impulse does not lift a vehicle; thrust does."}, {"page": "propellant-selection", "pageTitle": "4.4 Propellant Selection", "section": "Classifying launch vehicles", "anchor": "p44-launch-vehicles", "question": "A launch vehicle with a liftoff mass of 700 t places 14,000 kg in low Earth orbit. In which class is it?", "options": ["Medium: its payload lies between 2 and 20 t", "Heavy: its liftoff mass is above 500 t", "Small: its payload is only 2% of its liftoff mass", "Super heavy: its payload is more than 10 t"], "explanation": "The classes go by payload to low Earth orbit: small up to 2 t, medium 2 to 20 t, heavy 20 to 50 t, super heavy above 50 t. Liftoff mass and the payload share do not set the class, and 10 t is not one of the limits."}, {"page": "propellant-selection", "pageTitle": "4.4 Propellant Selection", "section": "What makes a propellant good", "anchor": "p44-propellant-properties", "question": "How do we classify liquid oxygen with liquid methane?", "options": ["A cryogenic bipropellant: both liquids boil far below room temperature", "A storable bipropellant, because methane is a common fuel at room temperature", "A hypergolic pair, because methane burns easily in oxygen", "A monopropellant, because both liquids are loaded together"], "explanation": "Both liquids boil far below room temperature (oxygen at about minus 183 °C, methane at about minus 161 °C), so the pair is cryogenic, and a fuel with an oxidizer in separate tanks is a bipropellant. Burning easily is not the same as igniting on contact, and the two liquids are kept in two tanks."}, {"page": "propellant-selection", "pageTitle": "4.4 Propellant Selection", "section": "What real vehicles burn, and why", "anchor": "what-real-vehicles-burn-and-why", "question": "The Saturn V burned liquid oxygen with kerosene in its first stage and liquid oxygen with hydrogen in the two stages above. Why that order?", "options": ["Near the ground, thrust and density matter most; high up, specific impulse does", "Hydrogen is denser than kerosene, so it fits the smaller upper stages", "Kerosene has the higher specific impulse, so it goes where the most mass is lifted", "The upper stages wait longer before they fire, so they need a storable propellant"], "explanation": "The first stage lifts the whole vehicle, so it needs high thrust from compact tanks, and oxygen with kerosene is about 3.6 times denser as a pair than oxygen with hydrogen. Every kilogram saved in an upper stage is a kilogram the stages below do not lift, so the upper stages use the pair with the higher specific impulse. Liquid hydrogen is cryogenic, not storable."}, {"page": "propellant-selection", "pageTitle": "4.4 Propellant Selection", "section": "What makes a propellant good", "anchor": "p44-propellant-properties", "question": "A tank must hold 4,800 kg of kerosene with a density of 800 kg/m<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>3<\/sup>. What volume of kerosene is that?", "options": ["6.000 m<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>3<\/sup>", "4.800 m<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>3<\/sup>", "0.1667 m<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>3<\/sup>", "3,840,000 m<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>3<\/sup>"], "explanation": "The volume is the mass divided by the density: 4,800 / 800 = 6.000 m<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>3<\/sup>. Using the density of water, 1,000 kg/m<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>3<\/sup>, gives 4.800; dividing the density by the mass gives 0.1667; multiplying them gives a number with the wrong units."}, {"page": "propellant-selection", "pageTitle": "4.4 Propellant Selection", "section": "How much thrust", "anchor": "p44-thrust-to-weight", "question": "A launch vehicle of 330 t has engines that give 2,850 kN at liftoff. With g<sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>0<span class=\"sr-only\">&nbsp;<\/span><\/sub> = 9.81 m/s<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>2<\/sup>, what happens when they ignite?", "options": ["It stays on the pad: the thrust-to-weight ratio is 0.880", "It rises slowly, because any thrust lifts a vehicle", "It rises, because 2,850 kN is more than 330 t", "It rises with an acceleration of 0.880 g"], "explanation": "The weight is 330,000 × 9.81 = 3,237 kN, more than the thrust, so the ratio 2,850/3,237 = 0.880 is below 1 and the vehicle cannot leave the pad. Comparing kN with tonnes mixes a force with a mass, and a ratio below 1 is not an acceleration upward."}, {"page": "propellant-selection", "pageTitle": "4.4 Propellant Selection", "section": "Justifying a choice", "anchor": "p44-justify", "question": "In the worked example the storable bipropellant starts heavier than the solid motor, yet it is recommended. Why?", "options": ["It can stop and restart, and later feeds the small burns that hold its position", "Its higher specific impulse makes it burn much less propellant than the solid", "Once its inert mass is counted it is lighter than the solid motor", "Its propellants are cryogenic, so they keep longer in the cold of space"], "explanation": "Both options burn almost the same propellant mass, because the heavier tanks of the liquid system cancel its higher specific impulse, and the liquid option is 183 kg heavier in all. It is chosen for restarts and for sharing its tanks with the later burns. Its propellants are storable, not cryogenic."}]}</script>
<script>
(function () {
  // In a page, follow the page's theme; opened on its own, follow the reader's setting.
  function syncTheme() {
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (window.parent !== window) {
      try { dark = window.parent.document.documentElement.classList.contains("dark"); } catch (e) {}
    }
    document.documentElement.classList.toggle("dark", dark);
  }
  syncTheme();
  try { new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true }); } catch (e) {}
  function fit() {
    try {
      var fe = window.frameElement;
      if (fe && fe.parentElement) fe.parentElement.style.height = (Math.ceil(document.body.getBoundingClientRect().height) + 2) + "px";
    } catch (e) {}
  }
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {}
  window.addEventListener("load", fit);

  var Q = JSON.parse(document.getElementById("data").textContent).questions;
  var n = Q.length, i = 0, answered = false, right = [];
  var el = {};
  ["progress", "fill", "quiz", "legend", "opts", "feedback", "go", "result", "score", "reviewIntro", "review", "again"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function shuffle(a) {
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  // Show question i. The options are drawn in a new order each time; option 0 is the correct one.
  function show(moveFocus) {
    var q = Q[i];
    answered = false;
    el.progress.textContent = "Question " + (i + 1) + " of " + n;
    el.fill.style.width = (100 * i / n) + "%";
    el.legend.innerHTML = '<span class="sr-only">Question ' + (i + 1) + " of " + n + ": </span>" + q.question;
    el.opts.innerHTML = "";
    el.opts.className = "";
    shuffle([0, 1, 2, 3]).forEach(function (k) {
      var label = document.createElement("label"), input = document.createElement("input"),
          text = document.createElement("span"), tag = document.createElement("span");
      label.className = "opt";
      input.type = "radio"; input.name = "answer"; input.value = String(k);
      text.className = "text"; text.innerHTML = q.options[k];
      tag.className = "tag";
      label.appendChild(input); label.appendChild(text); label.appendChild(tag);
      el.opts.appendChild(label);
    });
    el.feedback.className = "feedback";
    el.feedback.textContent = "";
    el.go.textContent = "Check answer";
    el.result.hidden = true;
    el.quiz.hidden = false;
    el.progress.setAttribute("aria-hidden", "true");
    if (moveFocus) el.legend.focus();
  }

  function check() {
    var chosen = el.quiz.querySelector("input[name=answer]:checked");
    if (!chosen) {
      el.feedback.className = "feedback show";
      el.feedback.textContent = "Choose an answer first.";
      return;
    }
    answered = true;
    right[i] = chosen.value === "0";
    Array.prototype.forEach.call(el.opts.querySelectorAll("label"), function (label) {
      var input = label.querySelector("input"), tag = label.querySelector(".tag");
      if (input.value === "0") { label.classList.add("right"); tag.textContent = "✓ correct answer"; }
      else if (input.checked) { label.classList.add("wrong"); tag.textContent = "✗ your answer"; }
      input.disabled = true;
    });
    el.opts.className = "locked";
    el.feedback.className = "feedback show";
    el.feedback.innerHTML = '<span class="verdict ' + (right[i] ? "ok" : "bad") + '">' +
      (right[i] ? "Correct." : "Not correct.") + "</span> " + Q[i].explanation;
    el.go.textContent = i + 1 < n ? "Next question" : "See your score";
    el.go.focus();
  }

  function finish() {
    var count = right.filter(Boolean).length;
    el.progress.textContent = "Result";
    el.progress.removeAttribute("aria-hidden");
    el.fill.style.width = "100%";
    el.score.textContent = count === n ? "All " + n + " correct." : count + " of " + n + " correct.";
    el.review.innerHTML = "";
    el.reviewIntro.hidden = count === n;
    el.review.hidden = count === n;
    // Each link opens its section; the page name follows in parentheses.
    Q.forEach(function (q, j) {
      if (right[j]) return;
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "../" + q.page + "#" + q.anchor; a.target = "_top"; a.textContent = q.section;
      // On the quiz's own page, scroll to the section and move focus there, without
      // reloading the page (which would also reset the quiz).
      a.addEventListener("click", function (e) {
        try {
          var top = window.top, here = top.location.pathname.replace(/\/$/, ""),
              there = new URL(a.href).pathname.replace(/\/$/, "");
          if (here !== there) return;
          var target = top.document.getElementById(q.anchor);
          if (!target) return;
          e.preventDefault();
          top.history.pushState(null, "", "#" + q.anchor);
          target.scrollIntoView();
          // Focus the heading's text, not the heading: the heading also holds the
          // pilcrow link, whose label a screen reader would read with it.
          var spot = target.querySelector(".heading-text") || target;
          if (!spot.hasAttribute("tabindex")) spot.setAttribute("tabindex", "-1");
          spot.focus({ preventScroll: true });
        } catch (err) {}
      });
      li.appendChild(document.createTextNode("Question " + (j + 1) + ": "));
      li.appendChild(a);
      li.appendChild(document.createTextNode(" (" + q.pageTitle + ")"));
      el.review.appendChild(li);
    });
    el.quiz.hidden = true;
    el.result.hidden = false;
    el.score.focus();
  }

  el.quiz.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!answered) { check(); return; }
    i++;
    if (i < n) show(true); else finish();
  });
  el.again.addEventListener("click", function () { i = 0; right = []; show(true); });
  show(false);
})();
</script>
