<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>Quiz: Standard 3.3, Drag Polar</title>
<style>
  /* The color variables match the quick checks (quickcheck/*.html). Change them together. */
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #4b5563; --card: #ffffff; --border: #d9d6ce;
    --head-bg: #f7f5f0; --head-fg: #111827; --accent: #6f5630; --accent-border: #cfb991;
    --input-bg: #ffffff; --input-border: #6b7280; --ok: #0a6b3d; --bad: #b42318;
    --button: #111827; --button-fg: #ffffff; --sol-bg: #f7f5f0;
    --link: #1d4ed8; --focus: #1d4ed8;
  }
  html.dark {
    --bg: #1c1917; --fg: #e5e7eb; --muted: #b7bcc6; --card: #292524; --border: #44403c;
    --head-bg: #363231; --head-fg: #ffffff; --accent: #cfb991; --accent-border: #cfb991;
    --input-bg: #1c1917; --input-border: #9ca3af; --ok: #6ee7b7; --bad: #fca5a5;

  html.dark { color-scheme: dark; }   /* native radio buttons drawn for a dark page */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { border: 1px solid var(--border); border-left: 5px solid var(--accent-border); border-radius: 8px;
          background: var(--card); overflow: hidden; }
  .head { background: var(--head-bg); color: var(--head-fg); padding: 10px 16px; font-weight: 700; font-size: 1.15em;
          display: flex; align-items: center; gap: 10px; }

  i { font-style: italic; }
  sub, sup { font-size: 0.75em; }
  .ov { text-decoration: overline; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  legend:focus { outline: none; }
  .progress:focus { outline: none; }
  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 0 0 14px; }

  .opt { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 10px; padding: 10px 12px; margin: 8px 0 0;
         border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); cursor: pointer; }
  .opt input { flex: none; width: 1.05em; height: 1.05em; margin: 0.25em 0 0; accent-color: var(--button); }
  .opt .text { flex: 1 1 12em; }
  .opt .tag { flex: none; font-weight: 600; font-size: 0.92em; }
  .opt:hover { border-color: var(--fg); }
  .opt:has(input:checked) { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 1px; }
  .locked .opt { cursor: default; }
  .locked .opt:hover { border-color: var(--input-border); }
  .locked .opt.right, .locked .opt.right:hover { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
  .locked .opt.wrong, .locked .opt.wrong:hover { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
  .opt.right .tag { color: var(--ok); }
  .opt.wrong .tag { color: var(--bad); }
  .feedback { margin: 14px 0 0; }
  .feedback.show { border: 1px solid var(--border); border-left: 4px solid var(--accent-border); border-radius: 6px;
                   background: var(--sol-bg); padding: 10px 14px; }
  .verdict { font-weight: 700; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .buttons { display: flex; gap: 12px; margin: 16px 0 0; }
  button { font: inherit; font-weight: 600; padding: 9px 20px; border-radius: 6px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .primary { background: var(--button); color: var(--button-fg); border: 1px solid var(--button); }
  .score { margin: 0 0 8px; font-size: 1.15em; font-weight: 700; color: var(--head-fg); }
  .score:focus { outline: none; }
  .result p { margin: 8px 0; }
  .result ul { margin: 8px 0 0; padding-left: 1.3em; }
  .result li { margin: 4px 0; }
  a { color: var(--link); }
  a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>

  </div>
</div>
<script type="application/json" id="data">{"questions": [{"page": "drag-polar", "pageTitle": "3.3 Drag Polar", "section": "Two kinds of drag", "anchor": "p33-drag-kinds", "question": "A rounded fairing is added in the corner where the wing of an airliner meets the fuselage. Which kind of drag does it mainly reduce?", "options": ["Interference drag, where the flows around the two parts meet", "Induced drag, because the fairing changes the wing's lift", "Wave drag, because the fairing weakens the shock waves", "Skin friction drag, because the fairing covers part of the skin"], "explanation": "Where two parts meet, the flows around them collide and the pair has more drag than the two alone. That extra is interference drag, and a fairing in the corner reduces it. The fairing does not change the lift or the span, so the induced drag stays the same. Wave drag appears only near the speed of sound. A fairing adds a little wetted area, so it does not lower the skin friction."}, {"page": "drag-polar", "pageTitle": "3.3 Drag Polar", "section": "Two kinds of drag", "anchor": "p33-drag-kinds", "question": "A round strut and a streamlined strut of the same thickness are tested in the same flow. Why does the round strut have much more drag?", "options": ["The flow leaves its surface and forms a wide wake of low pressure behind it", "It has more skin for the air to rub on, so its skin friction is larger", "It makes lift as the air goes around it, so it has induced drag", "The air speeds up around it, which raises the pressure on its back"], "explanation": "Behind a blunt body the boundary layer separates and leaves a wide wake whose pressure stays low, while the front feels a high pressure. The difference is the pressure drag. The streamlined strut keeps the flow attached and its wake thin. It has more wetted area than the round strut, not less. A symmetric strut in a straight flow makes no lift. Faster air has lower pressure, not higher."}, {"page": "drag-polar", "pageTitle": "3.3 Drag Polar", "section": "The drag polar", "anchor": "p33-drag-polar", "question": "An aircraft has the drag polar <i>C<\/i><sub>D<\/sub> = 0.016 + 0.050 <i>C<\/i><sub>L<\/sub><sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>2<\/sup>. What is its drag coefficient at <i>C<\/i><sub>L<\/sub> = 0.4?", "options": ["0.024", "0.036", "0.008", "0.011"], "explanation": "<i>C<\/i><sub>D<\/sub> = 0.016 + 0.050 × 0.4<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>2<\/sup> = 0.016 + 0.008 = 0.024. 0.036 forgets to square <i>C<\/i><sub>L<\/sub>; 0.008 is the induced part alone, without the zero-lift drag; 0.011 multiplies the sum of the two numbers by <i>C<\/i><sub>L<\/sub><sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>2<\/sup>."}, {"page": "drag-polar", "pageTitle": "3.3 Drag Polar", "section": "The drag polar", "anchor": "p33-drag-polar", "question": "A drag polar is built from wind-tunnel measurements of lift and drag on a model. What does each point of the finished polar stand for?", "options": ["One angle of attack of the model", "One speed of the tunnel", "One Reynolds number of the test", "One weight of the aircraft"], "explanation": "The model is set at a series of angles of attack, and at each one the lift and the drag are measured. Each angle gives one pair of coefficients, one point of the polar; the angle itself no longer shows on the graph. The whole polar holds for one Reynolds number, so the tunnel speed is held fixed, and the weight of the aircraft plays no part in a tunnel test."}, {"page": "drag-polar", "pageTitle": "3.3 Drag Polar", "section": "The drag polar", "anchor": "p33-drag-polar", "question": "Two airfoil sections of the same family and thickness differ only in camber: one is symmetric, the other cambered. Where does the cambered section have its lowest drag?", "options": ["At a positive lift coefficient", "At zero lift, as the symmetric one does", "At a negative lift coefficient", "At its maximum lift coefficient"], "explanation": "A symmetric section has its least drag at zero lift, and its polar is the same for positive and negative lift. Camber shifts the low-drag range to positive lift, where the section is meant to work. The cambered section on this page has its least drag between lift coefficients of about 0.26 and 0.88. Near the maximum lift coefficient the drag rises steeply."}, {"page": "drag-polar", "pageTitle": "3.3 Drag Polar", "section": "Drag against speed in steady level flight", "anchor": "p33-drag-speed", "question": "An airliner in steady level flight doubles its speed at the same altitude and weight. What happens to its parasite drag and its induced drag?", "options": ["Parasite drag becomes 4 times larger; induced drag becomes 4 times smaller", "Both become 4 times larger, because all drag grows with the speed squared", "Parasite drag doubles; induced drag halves", "Parasite drag becomes 4 times larger; induced drag stays the same"], "explanation": "In level flight <i>D<\/i> = <i>qSC<\/i><sub>D,0<\/sub> + <i>KW<\/i><sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>2<\/sup>/(<i>qS<\/i>), with <i>q<\/i> = ½<i>ρV<\/i><sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>2<\/sup>. Doubling <i>V<\/i> makes <i>q<\/i> 4 times larger: the parasite term grows 4 times and the induced term, which divides by <i>q<\/i>, falls to a quarter. The faster aircraft needs a lower lift coefficient, so its induced drag does not stay the same, and the dependence is on the square of the speed, not the speed itself."}, {"page": "drag-polar", "pageTitle": "3.3 Drag Polar", "section": "Minimum drag and the maximum lift-to-drag ratio", "anchor": "p33-minimum-drag", "question": "An aircraft with <i>C<\/i><sub>D,0<\/sub> = 0.023 flies at its minimum-drag speed. What is its drag coefficient there?", "options": ["0.046", "0.023", "0.0115", "0.069"], "explanation": "At minimum drag the lift coefficient is <i>C<\/i><sub>L<\/sub>* = √(<i>C<\/i><sub>D,0<\/sub>/<i>K<\/i>), so the induced part <i>KC<\/i><sub>L<\/sub>*<sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>2<\/sup> equals <i>C<\/i><sub>D,0<\/sub>, and <i>C<\/i><sub>D<\/sub> = 2 × 0.023 = 0.046. 0.023 is the zero-lift drag alone, the lowest point of the polar, where the aircraft would carry no weight. 0.0115 halves it, and 0.069 counts the induced part twice."}, {"page": "drag-polar", "pageTitle": "3.3 Drag Polar", "section": "Minimum drag and the maximum lift-to-drag ratio", "anchor": "p33-minimum-drag", "question": "An aircraft has <i>C<\/i><sub>D,0<\/sub> = 0.016 and <i>K<\/i> = 0.040. What is its maximum lift-to-drag ratio?", "options": ["19.8", "39.5", "781", "0.632"], "explanation": "(<i>L<\/i>/<i>D<\/i>)<sub>max<\/sub> = 1/(2√(<i>KC<\/i><sub>D,0<\/sub>)) = 1/(2√0.00064) = 1/(2 × 0.0253) = 19.8. 39.5 leaves out the 2; 781 leaves out the square root; 0.632 is <i>C<\/i><sub>L<\/sub>* = √(0.016/0.040), the lift coefficient at which the maximum occurs, not the ratio itself."}]}</script>
<script>
(function () {
  // In a page, follow the page's theme; opened on its own, follow the reader's setting.
  function syncTheme() {
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (window.parent !== window) {
      try { dark = window.parent.document.documentElement.classList.contains("dark"); } catch (e) {}
    }
    document.documentElement.classList.toggle("dark", dark);
  }
  syncTheme();
  try { new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true }); } catch (e) {}
  function fit() {
    try {
      var fe = window.frameElement;
      if (fe && fe.parentElement) fe.parentElement.style.height = (Math.ceil(document.body.getBoundingClientRect().height) + 2) + "px";
    } catch (e) {}
  }
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {}
  window.addEventListener("load", fit);

  var Q = JSON.parse(document.getElementById("data").textContent).questions;
  var n = Q.length, i = 0, answered = false, right = [];
  var el = {};
  ["progress", "fill", "quiz", "legend", "opts", "feedback", "go", "result", "score", "reviewIntro", "review", "again"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function shuffle(a) {
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  // Show question i. The options are drawn in a new order each time; option 0 is the correct one.
  function show(moveFocus) {
    var q = Q[i];
    answered = false;
    el.progress.textContent = "Question " + (i + 1) + " of " + n;
    el.fill.style.width = (100 * i / n) + "%";
    el.legend.innerHTML = '<span class="sr-only">Question ' + (i + 1) + " of " + n + ": </span>" + q.question;
    el.opts.innerHTML = "";
    el.opts.className = "";
    shuffle([0, 1, 2, 3]).forEach(function (k) {
      var label = document.createElement("label"), input = document.createElement("input"),
          text = document.createElement("span"), tag = document.createElement("span");
      label.className = "opt";
      input.type = "radio"; input.name = "answer"; input.value = String(k);
      text.className = "text"; text.innerHTML = q.options[k];
      tag.className = "tag";
      label.appendChild(input); label.appendChild(text); label.appendChild(tag);
      el.opts.appendChild(label);
    });
    el.feedback.className = "feedback";
    el.feedback.textContent = "";
    el.go.textContent = "Check answer";
    el.result.hidden = true;
    el.quiz.hidden = false;
    el.progress.setAttribute("aria-hidden", "true");
    if (moveFocus) el.legend.focus();
  }

  function check() {
    var chosen = el.quiz.querySelector("input[name=answer]:checked");
    if (!chosen) {
      el.feedback.className = "feedback show";
      el.feedback.textContent = "Choose an answer first.";
      return;
    }
    answered = true;
    right[i] = chosen.value === "0";
    Array.prototype.forEach.call(el.opts.querySelectorAll("label"), function (label) {
      var input = label.querySelector("input"), tag = label.querySelector(".tag");
      if (input.value === "0") { label.classList.add("right"); tag.textContent = "✓ correct answer"; }
      else if (input.checked) { label.classList.add("wrong"); tag.textContent = "✗ your answer"; }
      input.disabled = true;
    });
    el.opts.className = "locked";
    el.feedback.className = "feedback show";
    el.feedback.innerHTML = '<span class="verdict ' + (right[i] ? "ok" : "bad") + '">' +
      (right[i] ? "Correct." : "Not correct.") + "</span> " + Q[i].explanation;
    el.go.textContent = i + 1 < n ? "Next question" : "See your score";
    el.go.focus();
  }

  function finish() {
    var count = right.filter(Boolean).length;
    el.progress.textContent = "Result";
    el.progress.removeAttribute("aria-hidden");
    el.fill.style.width = "100%";
    el.score.textContent = count === n ? "All " + n + " correct." : count + " of " + n + " correct.";
    el.review.innerHTML = "";
    el.reviewIntro.hidden = count === n;
    el.review.hidden = count === n;
    // Each link opens its section; the page name follows in parentheses.
    Q.forEach(function (q, j) {
      if (right[j]) return;
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "../" + q.page + "#" + q.anchor; a.target = "_top"; a.textContent = q.section;
      // On the quiz's own page, scroll to the section and move focus there, without
      // reloading the page (which would also reset the quiz).
      a.addEventListener("click", function (e) {
        try {
          var top = window.top, here = top.location.pathname.replace(/\/$/, ""),
              there = new URL(a.href).pathname.replace(/\/$/, "");
          if (here !== there) return;
          var target = top.document.getElementById(q.anchor);
          if (!target) return;
          e.preventDefault();
          top.history.pushState(null, "", "#" + q.anchor);
          target.scrollIntoView();
          // Focus the heading's text, not the heading: the heading also holds the
          // pilcrow link, whose label a screen reader would read with it.
          var spot = target.querySelector(".heading-text") || target;
          if (!spot.hasAttribute("tabindex")) spot.setAttribute("tabindex", "-1");
          spot.focus({ preventScroll: true });
        } catch (err) {}
      });
      li.appendChild(document.createTextNode("Question " + (j + 1) + ": "));
      li.appendChild(a);
      li.appendChild(document.createTextNode(" (" + q.pageTitle + ")"));
      el.review.appendChild(li);
    });
    el.quiz.hidden = true;
    el.result.hidden = false;
    el.score.focus();
  }

  el.quiz.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!answered) { check(); return; }
    i++;
    if (i < n) show(true); else finish();
  });
  el.again.addEventListener("click", function () { i = 0; right = []; show(true); });
  show(false);
})();
</script>
