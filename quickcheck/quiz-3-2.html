<style>
  /* The color variables match the quick checks (quickcheck/*.html). Change them together. */
  :root {

                   background: var(--sol-bg); padding: 10px 14px; }

  .primary { background: var(--button); color: var(--button-fg); border: 1px solid var(--button); }

  a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>

<script type="application/json" id="data">{"questions": [{"page": "airfoil-and-finite-wing", "pageTitle": "3.2 Airfoil and Finite Wing", "section": "Free stream, angle of attack, lift, and drag", "anchor": "p32-angle-of-attack", "question": "A glider descends along a straight path 4° below the horizon. The chord line of its wing points 2° above the horizon. What is the angle of attack of the wing?", "options": ["6°, measured from the free stream, which comes up from 4° below the horizon", "2°, the angle between the chord line and the horizon", "4°, the angle between the flight path and the horizon", "Minus 2°, the pitch angle added to the flight-path angle"], "explanation": "The angle of attack is measured from the free stream, which runs along the flight path, to the chord line. The pitch angle is <i>θ<\/i> = <i>γ<\/i> + <i>α<\/i>, so <i>α<\/i> = 2 minus (minus 4) = 6°. The 2° is the pitch angle, measured from the horizon; the 4° is the flight-path angle; and adding the two angles instead of subtracting gives minus 2°."}, {"page": "airfoil-and-finite-wing", "pageTitle": "3.2 Airfoil and Finite Wing", "section": "Lift, drag, and moment coefficients", "anchor": "p32-coefficients", "question": "Why are airfoil data measured on a model that spans the wind tunnel test section from wall to wall?", "options": ["With no wing tips the flow is two-dimensional, so the data describe an infinite wing", "A model that touches the walls is stiffer, so it does not bend under the lift", "The walls block the drag, so the balance measures the lift alone", "A full-span model reaches the Reynolds number of a full-size aircraft wing"], "explanation": "With the model touching both walls the air finds no tip to flow around, so there are no tip vortices and no downwash. The result is the section data of an infinite wing, written with lowercase coefficients. Stiffness is not the reason, the walls do not remove the drag, and the Reynolds number depends on the chord and the speed, not on the span."}, {"page": "airfoil-and-finite-wing", "pageTitle": "3.2 Airfoil and Finite Wing", "section": "The pitching moment and the aerodynamic center", "anchor": "p32-moment", "question": "What makes the aerodynamic center of an airfoil more useful than its center of pressure?", "options": ["The moment about it stays the same as the angle of attack changes, while the center of pressure moves", "The moment about it is always zero, so the lift alone describes the airfoil", "It is the point where the resultant force acts, and that point stays fixed", "It lies exactly at the leading edge, where the free stream first meets the airfoil"], "explanation": "About the aerodynamic center, near the quarter chord, the pitching moment does not change with the angle of attack. The center of pressure is the point where the resultant acts and the moment is zero, but it moves as the lift changes. The moment about the aerodynamic center is zero only for a symmetric airfoil, and the point is not at the leading edge."}, {"page": "airfoil-and-finite-wing", "pageTitle": "3.2 Airfoil and Finite Wing", "section": "Reading airfoil data", "anchor": "p32-airfoil-data", "question": "An airfoil chart has curves for Reynolds numbers of 3, 6, and 9 million. Your model wing runs at a Reynolds number of 4.2 million. Which curve do you read?", "options": ["The 3 million curve, the closest to 4.2 million", "The 6 million curve, the next one above 4.2 million", "The 9 million curve, the highest one tested", "Any of them, because the Reynolds number does not change the data"], "explanation": "Read the curve whose Reynolds number is closest to yours: 4.2 million is 1.2 million from 3 million and 1.8 million from 6 million. Rounding up to the next curve, or taking the highest one, gives a higher maximum lift and a lower drag than your wing will see. The curves do differ, most near stall and at the edges of the drag bucket."}, {"page": "airfoil-and-finite-wing", "pageTitle": "3.2 Airfoil and Finite Wing", "section": "Reading airfoil data", "anchor": "p32-airfoil-data", "question": "On the chart of a cambered airfoil you read a quarter-chord moment coefficient of minus 0.10. What does the minus sign tell you?", "options": ["The moment pitches the nose down, as for any positively cambered airfoil", "The moment pitches the nose up, which camber always produces", "The airfoil is at a negative angle of attack", "Nothing; the size of the moment matters and the sign can be dropped"], "explanation": "We take a nose-up moment as positive, so a negative moment coefficient pitches the nose down. A positively cambered airfoil carries more lift on the rear of its chord and has a nose-down moment at every angle of attack below stall, including positive ones. Dropping the sign reverses the moment."}, {"page": "airfoil-and-finite-wing", "pageTitle": "3.2 Airfoil and Finite Wing", "section": "Why a finite wing is different", "anchor": "p32-finite-wing", "question": "How does the downwash from the tip vortices create induced drag on a finite wing?", "options": ["It tilts the local relative wind down, so the lift, perpendicular to it, tilts back", "It raises the pressure on the upper surface, so the wing loses lift", "It increases the skin friction on the wing, because the air moves faster", "It pushes the whole wing down, so the engines must lift the extra weight"], "explanation": "The downwash adds to the free stream, so each section meets a local relative wind tilted down by the induced angle. The section's lift is perpendicular to that local wind and so tilts back by the same angle; its backward component is the induced drag. Skin friction belongs to the section drag, and the downwash adds no weight to the wing."}, {"page": "airfoil-and-finite-wing", "pageTitle": "3.2 Airfoil and Finite Wing", "section": "Induced drag", "anchor": "p32-induced-drag", "question": "A wing of aspect ratio 10 with span efficiency factor 0.8 flies at <i>C<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>L<span class=\"sr-only\">&nbsp;<\/span><\/sub> = 0.6. What is its induced drag coefficient?", "options": ["0.0143", "0.0239", "0.0115", "0.821"], "explanation": "<i>C<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>D,i<span class=\"sr-only\">&nbsp;<\/span><\/sub> = <i>C<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>L<span class=\"sr-only\">&nbsp;<\/span><\/sub><sup><span class=\"sr-only\">&nbsp;to the power&nbsp;<\/span>2<\/sup>/(π<i>e<\/i> <i>AR<\/i>) = 0.36/(π × 0.8 × 10) = 0.36/25.13 = 0.0143. Leaving <i>C<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>L<span class=\"sr-only\">&nbsp;<\/span><\/sub> unsquared gives 0.0239, leaving out <i>e<\/i> gives 0.0115, and multiplying by 57.3, which belongs only to the induced angle in degrees, gives 0.821."}, {"page": "airfoil-and-finite-wing", "pageTitle": "3.2 Airfoil and Finite Wing", "section": "The lift curve of a finite wing", "anchor": "p32-lift-curve", "question": "An airfoil has a lift-curve slope <i>a<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>0<span class=\"sr-only\">&nbsp;<\/span><\/sub> = 0.11 per degree. What is the lift-curve slope of a wing with this airfoil, an aspect ratio of 6 and <i>e<\/i> = 1?", "options": ["0.0824 per degree", "0.109 per degree", "0.147 per degree", "0.329 per degree"], "explanation": "<i>a<\/i> = <i>a<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>0<span class=\"sr-only\">&nbsp;<\/span><\/sub>/(1 + 57.3<i>a<\/i><sub><span class=\"sr-only\">,&nbsp;sub,&nbsp;<\/span>0<span class=\"sr-only\">&nbsp;<\/span><\/sub>/(π<i>e<\/i> <i>AR<\/i>)) = 0.11/(1 + 6.303/18.85) = 0.11/1.334 = 0.0824 per degree, smaller than the airfoil's slope. Leaving out the 57.3 gives 0.109, multiplying by the bracket instead of dividing gives 0.147, and dropping the 1 from the bracket gives 0.329."}]}</script>
<script>
(function () {
  // In a page, follow the page's theme; opened on its own, follow the reader's setting.
  function syncTheme() {
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (window.parent !== window) {
      try { dark = window.parent.document.documentElement.classList.contains("dark"); } catch (e) {}
    }
    document.documentElement.classList.toggle("dark", dark);
  }
  syncTheme();
  try { new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true }); } catch (e) {}
  function fit() {
    try {
      var fe = window.frameElement;
      if (fe && fe.parentElement) fe.parentElement.style.height = (Math.ceil(document.body.getBoundingClientRect().height) + 2) + "px";
    } catch (e) {}
  }
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {}
  window.addEventListener("load", fit);

  var Q = JSON.parse(document.getElementById("data").textContent).questions;
  var n = Q.length, i = 0, answered = false, right = [];
  var el = {};
  ["progress", "fill", "quiz", "legend", "opts", "feedback", "go", "result", "score", "reviewIntro", "review", "again"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function shuffle(a) {
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  // Show question i. The options are drawn in a new order each time; option 0 is the correct one.
  function show(moveFocus) {
    var q = Q[i];
    answered = false;
    el.progress.textContent = "Question " + (i + 1) + " of " + n;
    el.fill.style.width = (100 * i / n) + "%";
    el.legend.innerHTML = '<span class="sr-only">Question ' + (i + 1) + " of " + n + ": </span>" + q.question;
    el.opts.innerHTML = "";
    el.opts.className = "";
    shuffle([0, 1, 2, 3]).forEach(function (k) {
      var label = document.createElement("label"), input = document.createElement("input"),
          text = document.createElement("span"), tag = document.createElement("span");
      label.className = "opt";
      input.type = "radio"; input.name = "answer"; input.value = String(k);
      text.className = "text"; text.innerHTML = q.options[k];
      tag.className = "tag";
      label.appendChild(input); label.appendChild(text); label.appendChild(tag);
      el.opts.appendChild(label);
    });
    el.feedback.className = "feedback";
    el.feedback.textContent = "";
    el.go.textContent = "Check answer";
    el.result.hidden = true;
    el.quiz.hidden = false;
    el.progress.setAttribute("aria-hidden", "true");
    if (moveFocus) el.legend.focus();
  }

  function check() {
    var chosen = el.quiz.querySelector("input[name=answer]:checked");
    if (!chosen) {
      el.feedback.className = "feedback show";
      el.feedback.textContent = "Choose an answer first.";
      return;
    }
    answered = true;
    right[i] = chosen.value === "0";
    Array.prototype.forEach.call(el.opts.querySelectorAll("label"), function (label) {
      var input = label.querySelector("input"), tag = label.querySelector(".tag");
      if (input.value === "0") { label.classList.add("right"); tag.textContent = "✓ correct answer"; }
      else if (input.checked) { label.classList.add("wrong"); tag.textContent = "✗ your answer"; }
      input.disabled = true;
    });
    el.opts.className = "locked";
    el.feedback.className = "feedback show";
    el.feedback.innerHTML = '<span class="verdict ' + (right[i] ? "ok" : "bad") + '">' +
      (right[i] ? "Correct." : "Not correct.") + "</span> " + Q[i].explanation;
    el.go.textContent = i + 1 < n ? "Next question" : "See your score";
    el.go.focus();
  }

  function finish() {
    var count = right.filter(Boolean).length;
    el.progress.textContent = "Result";
    el.progress.removeAttribute("aria-hidden");
    el.fill.style.width = "100%";
    el.score.textContent = count === n ? "All " + n + " correct." : count + " of " + n + " correct.";
    el.review.innerHTML = "";
    el.reviewIntro.hidden = count === n;
    el.review.hidden = count === n;
    // Each link opens its section; the page name follows in parentheses.
    Q.forEach(function (q, j) {
      if (right[j]) return;
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "../" + q.page + "#" + q.anchor; a.target = "_top"; a.textContent = q.section;
      // On the quiz's own page, scroll to the section and move focus there, without
      // reloading the page (which would also reset the quiz).
      a.addEventListener("click", function (e) {
        try {
          var top = window.top, here = top.location.pathname.replace(/\/$/, ""),
              there = new URL(a.href).pathname.replace(/\/$/, "");
          if (here !== there) return;
          var target = top.document.getElementById(q.anchor);
          if (!target) return;
          e.preventDefault();
          top.history.pushState(null, "", "#" + q.anchor);
          target.scrollIntoView();
          // Focus the heading's text, not the heading: the heading also holds the
          // pilcrow link, whose label a screen reader would read with it.
          var spot = target.querySelector(".heading-text") || target;
          if (!spot.hasAttribute("tabindex")) spot.setAttribute("tabindex", "-1");
          spot.focus({ preventScroll: true });
        } catch (err) {}
      });
      li.appendChild(document.createTextNode("Question " + (j + 1) + ": "));
      li.appendChild(a);
      li.appendChild(document.createTextNode(" (" + q.pageTitle + ")"));
      el.review.appendChild(li);
    });
    el.quiz.hidden = true;
    el.result.hidden = false;
    el.score.focus();
  }

  el.quiz.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!answered) { check(); return; }
    i++;
    if (i < n) show(true); else finish();
  });
  el.again.addEventListener("click", function () { i = 0; right = []; show(true); });
  show(false);
})();
</script>
