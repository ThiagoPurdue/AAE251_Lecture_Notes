<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz: Standard 1.1, Needs and Requirements</title>
<style>
  /* The color variables match the quick checks (quickcheck/*.html). Change them together. */
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #4b5563; --card: #ffffff; --border: #d9d6ce;
    --head-bg: #f7f5f0; --head-fg: #111827; --accent: #6f5630; --accent-border: #cfb991;
    --input-bg: #ffffff; --input-border: #6b7280; --ok: #0a6b3d; --bad: #b42318;
    --button: #111827; --button-fg: #ffffff; --sol-bg: #f7f5f0;
    --link: #1d4ed8; --focus: #1d4ed8;
  }
  html.dark {
    --bg: #1c1917; --fg: #e5e7eb; --muted: #b7bcc6; --card: #292524; --border: #44403c;
    --head-bg: #363231; --head-fg: #ffffff; --accent: #cfb991; --accent-border: #cfb991;
    --input-bg: #1c1917; --input-border: #9ca3af; --ok: #6ee7b7; --bad: #fca5a5;
    --button: #cfb991; --button-fg: #000000; --sol-bg: #363231;
    --link: #93c5fd; --focus: #93c5fd;
  }
  html.dark { color-scheme: dark; }   /* native radio buttons drawn for a dark page */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { border: 1px solid var(--border); border-left: 5px solid var(--accent-border); border-radius: 8px;
          background: var(--card); overflow: hidden; }
  .head { background: var(--head-bg); color: var(--head-fg); padding: 10px 16px; font-weight: 700; font-size: 1.15em;
          display: flex; align-items: center; gap: 10px; }
  .head svg { width: 22px; height: 22px; flex: none; }
  .body { padding: 16px; }
  i { font-style: italic; }
  sub, sup { font-size: 0.75em; }
  .ov { text-decoration: overline; }
  .progress { margin: 0 0 6px; color: var(--muted); font-size: 0.95em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  legend:focus { outline: none; }
  .progress:focus { outline: none; }
  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 0 0 14px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent-border); }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; margin: 0 0 4px; font-size: 1.08em; font-weight: 600; color: var(--head-fg); }
  .opt { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 10px; padding: 10px 12px; margin: 8px 0 0;
         border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); cursor: pointer; }
  .opt input { flex: none; width: 1.05em; height: 1.05em; margin: 0.25em 0 0; accent-color: var(--button); }
  .opt .text { flex: 1 1 12em; }
  .opt .tag { flex: none; font-weight: 600; font-size: 0.92em; }
  .opt:hover { border-color: var(--fg); }
  .opt:has(input:checked) { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 1px; }
  .locked .opt { cursor: default; }
  .locked .opt:hover { border-color: var(--input-border); }
  .locked .opt.right, .locked .opt.right:hover { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
  .locked .opt.wrong, .locked .opt.wrong:hover { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
  .opt.right .tag { color: var(--ok); }
  .opt.wrong .tag { color: var(--bad); }
  .feedback { margin: 14px 0 0; }
  .feedback.show { border: 1px solid var(--border); border-left: 4px solid var(--accent-border); border-radius: 6px;
                   background: var(--sol-bg); padding: 10px 14px; }
  .verdict { font-weight: 700; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .buttons { display: flex; gap: 12px; margin: 16px 0 0; }
  button { font: inherit; font-weight: 600; padding: 9px 20px; border-radius: 6px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .primary { background: var(--button); color: var(--button-fg); border: 1px solid var(--button); }
  .score { margin: 0 0 8px; font-size: 1.15em; font-weight: 700; color: var(--head-fg); }
  .score:focus { outline: none; }
  .result p { margin: 8px 0; }
  .result ul { margin: 8px 0 0; padding-left: 1.3em; }
  .result li { margin: 4px 0; }
  a { color: var(--link); }
  a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M9 10l1.5 1.5L13.5 8.5M9 16h6"/></svg>
    Quiz: Standard 1.1, Needs and Requirements
  </div>
  <div class="body">
    <noscript><p>The quiz needs JavaScript.</p></noscript>
    <p class="progress" id="progress" aria-hidden="true"></p>
    <div class="bar" aria-hidden="true"><span id="fill"></span></div>
    <form id="quiz" novalidate>
      <fieldset>
        <legend id="legend" tabindex="-1"></legend>
        <div id="opts"></div>
      </fieldset>
      <div class="feedback" id="feedback" role="status"></div>
      <div class="buttons">
        <button type="submit" class="primary" id="go">Check answer</button>
      </div>
    </form>
    <div class="result" id="result" hidden>
      <p class="score" id="score" tabindex="-1"></p>
      <p id="reviewIntro">Review these sections, then start over:</p>
      <ul id="review"></ul>
      <div class="buttons">
        <button type="button" class="primary" id="again">Start over</button>
      </div>
    </div>
  </div>
</div>
<script type="application/json" id="data">{"questions": [{"page": "needs-and-requirements", "pageTitle": "1.1 Needs and Requirements", "section": "What a system is", "anchor": "what-a-system-is", "question": "An engineer writes: \"The aircraft is the system. The airports, air traffic control, and the weather are not part of it.\" Which of the four descriptions of a system is this?", "options": ["The boundary: it says what is inside the system and what is outside it", "The function: it says what the aircraft does and where it does it", "The inputs and outputs: it lists what crosses into the system", "The form: it describes what the aircraft physically is and holds"], "explanation": "Saying where the system ends and its environment begins is the boundary. The function is what the system does (a verb). The inputs and outputs are what cross the boundary, and the form is its shape, size, and parts. Airports and the weather lie outside the boundary; they are not inputs to it."}, {"page": "needs-and-requirements", "pageTitle": "1.1 Needs and Requirements", "section": "Stakeholders", "anchor": "stakeholders", "question": "Why are the people who live under a new airliner's departure path listed as stakeholders, though they never fly in it?", "options": ["They are affected by its noise, so their needs become constraints on the design", "They are not stakeholders: only the people who pay for or use a system are", "They count only if some of them buy tickets on the airliner", "They are listed in place of the regulator, which then need not be listed"], "explanation": "A stakeholder is anyone affected by the system or with a stake in it, and that goes beyond its buyers and users. The neighbors hear the noise, and their needs reach the design as constraints such as noise rules. The regulator is a stakeholder of its own, so you list it as well."}, {"page": "needs-and-requirements", "pageTitle": "1.1 Needs and Requirements", "section": "The mission statement", "anchor": "p11-mission-statement", "question": "Which is the best mission statement for a system that measures hurricanes from the air?", "options": ["A system that measures the winds inside a hurricane every six hours, so forecasters can warn coastal towns sooner", "A four-engine turboprop aircraft with a weather radar under its belly, a crew of six, and room for instruments", "The aircraft shall stay airborne for at least 10 hours with its weather radar running and its crew of six on board", "A reliable, advanced, and cost-effective airborne system that serves the National Weather Service and its forecasters"], "explanation": "A mission statement gives the capability and the benefit, and it names no design. The turboprop names a design. The \"shall\" sentence is a requirement, with a metric and a value. The \"reliable, advanced\" statement says neither what the system does nor what it brings, because \"reliable\" and \"advanced\" are qualities, not a capability."}, {"page": "needs-and-requirements", "pageTitle": "1.1 Needs and Requirements", "section": "Need statements", "anchor": "need-statements", "question": "A traffic-reporting helicopter pilot says: \"Put a bigger fuel tank in it, so I do not have to land during the morning rush.\" Which need statement follows the guidelines?", "options": ["The helicopter stays airborne through the whole morning rush hour without refueling.", "The helicopter has a fuel tank larger than the one on the helicopter it replaces.", "The helicopter should land less often during the morning rush hour than it does now.", "The fuel truck can reach the helicopter quickly between flights in the morning rush."], "explanation": "The larger tank is a solution: it says how, not what. \"Should land less often\" uses \"should\" and is vague. The fuel truck sentence is written from the truck's point of view, not as an attribute of the helicopter. Staying airborne through the whole rush says what is needed, specifically, as an attribute of the system."}, {"page": "needs-and-requirements", "pageTitle": "1.1 Needs and Requirements", "section": "Ranking needs", "anchor": "ranking-needs", "question": "Three stakeholders rate a need 5, 2, and 4 on the 1 to 5 scale. What is its average rating?", "options": ["3.667", "4.000", "11.00", "3.500"], "explanation": "<i>r<\/i><sub>avg<\/sub> = (5 + 2 + 4)/3 = 11/3 = 3.667. If you picked 4.000, you took the middle value (the median). 11.00 is the sum before you divide by the number of stakeholders, and 3.500 averages only the highest and lowest ratings."}, {"page": "needs-and-requirements", "pageTitle": "1.1 Needs and Requirements", "section": "Requirements", "anchor": "p11-requirements", "question": "Which requirement for a satellite's solar arrays is both dependent and verifiable?", "options": ["The arrays deliver at least 2 kW at the end of the satellite's 10-year life.", "The arrays use gallium arsenide solar cells on two deployable carbon fiber panels.", "The arrays deliver plenty of power for every instrument, at every point of the orbit.", "The arrays are as light as possible for the power the instruments need to run."], "explanation": "The power delivered is a result of the design, so the requirement is dependent, and its value can be checked, so it is verifiable. The cell material names the design itself. \"Plenty\" and \"as light as possible\" have no value, so no analysis or test can show that they are met."}, {"page": "needs-and-requirements", "pageTitle": "1.1 Needs and Requirements", "section": "Traceability", "anchor": "p11-traceability", "question": "In a traceability matrix with one row per need and one column per requirement, the column of R9 holds no mark. What does this mean, and what do you do?", "options": ["R9 traces to no need: write down the need it serves, or remove R9", "A need has no requirement yet: write a new requirement for that need", "R9 has already been verified, so no more work on it is needed", "R9 is the most important requirement, because no need places a limit on it"], "explanation": "Columns are requirements, so an empty column is a requirement that answers no need. Either a need was left out of the list, and you write it down, or the requirement is work nobody asked for, and you remove it. An empty row would be a need with no requirement. The matrix says nothing about verification."}, {"page": "needs-and-requirements", "pageTitle": "1.1 Needs and Requirements", "section": "Verification", "anchor": "p11-verification", "question": "To show that one person wearing gloves can open an emergency exit hatch, a person in gloves opens it while the engineers watch. Nothing is measured. Which verification method is this?", "options": ["Demonstration", "Test", "Inspection", "Analysis"], "explanation": "Operating the system and observing it, with few or no measurements, is a demonstration. A test also operates the system but measures under controlled conditions; an inspection only looks at the drawing or the hardware; an analysis predicts the result by calculation."}]}</script>
<script>
(function () {
  // In a page, follow the page's theme; opened on its own, follow the reader's setting.
  function syncTheme() {
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (window.parent !== window) {
      try { dark = window.parent.document.documentElement.classList.contains("dark"); } catch (e) {}
    }
    document.documentElement.classList.toggle("dark", dark);
  }
  syncTheme();
  try { new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true }); } catch (e) {}
  function fit() {
    try {
      var fe = window.frameElement;
      if (fe && fe.parentElement) fe.parentElement.style.height = (Math.ceil(document.body.getBoundingClientRect().height) + 2) + "px";
    } catch (e) {}
  }
  try { new ResizeObserver(fit).observe(document.body); } catch (e) {}
  window.addEventListener("load", fit);

  var Q = JSON.parse(document.getElementById("data").textContent).questions;
  var n = Q.length, i = 0, answered = false, right = [];
  var el = {};
  ["progress", "fill", "quiz", "legend", "opts", "feedback", "go", "result", "score", "reviewIntro", "review", "again"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function shuffle(a) {
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  // Show question i. The options are drawn in a new order each time; option 0 is the correct one.
  function show(moveFocus) {
    var q = Q[i];
    answered = false;
    el.progress.textContent = "Question " + (i + 1) + " of " + n;
    el.fill.style.width = (100 * i / n) + "%";
    el.legend.innerHTML = '<span class="sr-only">Question ' + (i + 1) + " of " + n + ": </span>" + q.question;
    el.opts.innerHTML = "";
    el.opts.className = "";
    shuffle([0, 1, 2, 3]).forEach(function (k) {
      var label = document.createElement("label"), input = document.createElement("input"),
          text = document.createElement("span"), tag = document.createElement("span");
      label.className = "opt";
      input.type = "radio"; input.name = "answer"; input.value = String(k);
      text.className = "text"; text.innerHTML = q.options[k];
      tag.className = "tag";
      label.appendChild(input); label.appendChild(text); label.appendChild(tag);
      el.opts.appendChild(label);
    });
    el.feedback.className = "feedback";
    el.feedback.textContent = "";
    el.go.textContent = "Check answer";
    el.result.hidden = true;
    el.quiz.hidden = false;
    el.progress.setAttribute("aria-hidden", "true");
    if (moveFocus) el.legend.focus();
  }

  function check() {
    var chosen = el.quiz.querySelector("input[name=answer]:checked");
    if (!chosen) {
      el.feedback.className = "feedback show";
      el.feedback.textContent = "Choose an answer first.";
      return;
    }
    answered = true;
    right[i] = chosen.value === "0";
    Array.prototype.forEach.call(el.opts.querySelectorAll("label"), function (label) {
      var input = label.querySelector("input"), tag = label.querySelector(".tag");
      if (input.value === "0") { label.classList.add("right"); tag.textContent = "✓ correct answer"; }
      else if (input.checked) { label.classList.add("wrong"); tag.textContent = "✗ your answer"; }
      input.disabled = true;
    });
    el.opts.className = "locked";
    el.feedback.className = "feedback show";
    el.feedback.innerHTML = '<span class="verdict ' + (right[i] ? "ok" : "bad") + '">' +
      (right[i] ? "Correct." : "Not correct.") + "</span> " + Q[i].explanation;
    el.go.textContent = i + 1 < n ? "Next question" : "See your score";
    el.go.focus();
  }

  function finish() {
    var count = right.filter(Boolean).length;
    el.progress.textContent = "Result";
    el.progress.removeAttribute("aria-hidden");
    el.fill.style.width = "100%";
    el.score.textContent = count === n ? "All " + n + " correct." : count + " of " + n + " correct.";
    el.review.innerHTML = "";
    el.reviewIntro.hidden = count === n;
    el.review.hidden = count === n;
    // Each link opens its section; the page name follows in parentheses.
    Q.forEach(function (q, j) {
      if (right[j]) return;
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "../" + q.page + "#" + q.anchor; a.target = "_top"; a.textContent = q.section;
      // On the quiz's own page, scroll to the section and move focus there, without
      // reloading the page (which would also reset the quiz).
      a.addEventListener("click", function (e) {
        try {
          var top = window.top, here = top.location.pathname.replace(/\/$/, ""),
              there = new URL(a.href).pathname.replace(/\/$/, "");
          if (here !== there) return;
          var target = top.document.getElementById(q.anchor);
          if (!target) return;
          e.preventDefault();
          top.history.pushState(null, "", "#" + q.anchor);
          target.scrollIntoView();
          // Focus the heading's text, not the heading: the heading also holds the
          // pilcrow link, whose label a screen reader would read with it.
          var spot = target.querySelector(".heading-text") || target;
          if (!spot.hasAttribute("tabindex")) spot.setAttribute("tabindex", "-1");
          spot.focus({ preventScroll: true });
        } catch (err) {}
      });
      li.appendChild(document.createTextNode("Question " + (j + 1) + ": "));
      li.appendChild(a);
      li.appendChild(document.createTextNode(" (" + q.pageTitle + ")"));
      el.review.appendChild(li);
    });
    el.quiz.hidden = true;
    el.result.hidden = false;
    el.score.focus();
  }

  el.quiz.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!answered) { check(); return; }
    i++;
    if (i < n) show(true); else finish();
  });
  el.again.addEventListener("click", function () { i = 0; right = []; show(true); });
  show(false);
})();
</script>
</body>
</html>
