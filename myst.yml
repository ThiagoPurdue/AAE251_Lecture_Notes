# Jupyter Book 2 (MyST) configuration for the AAE251 lecture notes.
# Build locally:   jupyter-book start        (live preview)
#                  jupyter-book build --html (static site in _build/html)
# Build in a copy outside OneDrive: see README.md.
version: 1
project:
  id: aae251-lecture-notes
  title: AAE251 Lecture Notes
  subtitle: Introduction to Aerospace Design
  description: Lecture notes for AAE 25100 Introduction to Aerospace Design at Purdue University, in five chapters that follow the five groups of course standards.
  keywords:
    - aerospace design
    - systems engineering
    - orbital mechanics
    - aerodynamics
    - rocket design
    - aircraft performance
  authors:
    - name: Thiago Guimarães
      affiliations:
        - Purdue University, School of Aeronautics and Astronautics
  github: https://github.com/ThiagoPurdue/AAE251_Lecture_Notes
  exclude:
    - README.md
    - quickcheck/**
    - scripts/**
    - notes/_parts/**
    - notes/_static/**
  # One entry per chapter, one page per standard. Add a chapter block when its first page
  # is written; `python3 scripts/make_standards.py --toc` prints the full block, with the
  # chapter titles and page names taken from the course standards.
  toc:
    - file: notes/index.md
    - title: "Chapter 1: Systems Engineering and Fundamental Thoughts"
      children:
        - file: notes/chapter-1/needs-and-requirements.md
        - file: notes/chapter-1/hazards-and-risk.md
        - file: notes/chapter-1/vehicle-anatomy.md
        - file: notes/chapter-1/standard-atmosphere.md
        - file: notes/chapter-1/bernoulli-and-pitot-static.md
        - file: notes/chapter-1/aircraft-sizing.md
        - file: notes/chapter-1/concepts-and-trade-studies.md
    - title: "Chapter 2: Introduction to Orbits"
      children:
        - file: notes/chapter-2/orbit-properties.md
        - file: notes/chapter-2/orbit-transfers.md
        - file: notes/chapter-2/launch-to-orbit.md
        - file: notes/chapter-2/patched-conics.md
        - file: notes/chapter-2/ground-tracks-and-orbit-lifetime.md
    - title: "Chapter 3: Aerodynamics"
      children:
        - file: notes/chapter-3/wind-tunnels.md
        - file: notes/chapter-3/airfoil-and-finite-wing.md
        - file: notes/chapter-3/drag-polar.md
        - file: notes/chapter-3/wing-loading.md
    - title: "Chapter 4: Rocket Design"
      children:
        - file: notes/chapter-4/thrust-and-specific-impulse.md
        - file: notes/chapter-4/rocket-equation.md
        - file: notes/chapter-4/multistage-rockets.md
        - file: notes/chapter-4/propellant-selection.md
        - file: notes/chapter-4/engines-and-tanks.md
    - title: "Chapter 5: Aircraft Performance and Propulsion"
      children:
        - file: notes/chapter-5/thrust-and-power.md
        - file: notes/chapter-5/range-and-endurance.md
        - file: notes/chapter-5/climb-and-ceiling.md
        - file: notes/chapter-5/engines.md
        - file: notes/chapter-5/constraint-diagram-and-field-length.md
    - file: notes/glossary.md
    - file: notes/accessibility.md
site:
  template: book-theme
  options:
    logo: notes/_static/logo.svg
    logo_dark: notes/_static/logo.svg
    # The mark is decorative: the link already reads the book title.
    logo_alt: ""
    logo_text: AAE251 Lecture Notes
    favicon: notes/_static/favicon.ico
    hide_authors: true
    style: notes/_static/site.css
  parts:
    primary_sidebar_footer: notes/_parts/sidebar-footer.md
