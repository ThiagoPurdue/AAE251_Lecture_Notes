    <text style="font-size: 11px; font-family: Arial, Helvetica, sans-serif" transform="translate(392.6 158.660953)">up to 45</text>
    <text style="font-size: 11px; font-family: Arial, Helvetica, sans-serif" transform="translate(392.6 170.295516)">knots</text>
   </g>
