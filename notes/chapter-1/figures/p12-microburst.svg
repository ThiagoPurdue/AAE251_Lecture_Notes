   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: Arial, Helvetica, sans-serif" transform="translate(49.492969 142.591828)">outflow:</text>
    <text style="font-size: 11px; font-family: Arial, Helvetica, sans-serif" transform="translate(24.418125 154.226391)">headwind for</text>
    <text style="font-size: 11px; font-family: Arial, Helvetica, sans-serif" transform="translate(32.382812 165.860953)">the aircraft,</text>
    <text style="font-size: 11px; font-family: Arial, Helvetica, sans-serif" transform="translate(18.301094 177.495516)">up to 45 knots</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: Arial, Helvetica, sans-serif" transform="translate(392.6 135.391828)">outflow:</text>
