   <g id="text_1">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(33.644063 74.747766)">Range with a full</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(36.973125 87.151172)">passenger load</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle" x="213" y="80.946656" transform="rotate(-0 213 80.946656)">At least 3,000 nmi</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(314.3325 62.391375)">Boston to Los Angeles is</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(307.673438 74.83575)">2,264 nmi on a great circle;</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(322.020938 87.239156)">the rest covers winds,</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(313.673438 99.501938)">detours, and reserve fuel</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle" x="245.04" y="167.102063" transform="rotate(-0 245.04 167.102063)">Requirement: the range with a full passenger load is at least 3,000 nmi.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: Arial, Helvetica, sans-serif; text-anchor: start" x="13.2" y="21.789375" transform="rotate(-0 13.2 21.789375)">Metric</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif; text-anchor: start" x="13.2" y="36.429375" transform="rotate(-0 13.2 36.429375)">what is measured</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: Arial, Helvetica, sans-serif; text-anchor: start" x="157.2" y="21.789375" transform="rotate(-0 157.2 21.789375)">Value</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif; text-anchor: start" x="157.2" y="36.429375" transform="rotate(-0 157.2 36.429375)">how much</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: Arial, Helvetica, sans-serif; text-anchor: start" x="283.2" y="21.789375" transform="rotate(-0 283.2 21.789375)">Reason</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif; text-anchor: start" x="283.2" y="36.429375" transform="rotate(-0 283.2 36.429375)">why that much</text>
   </g>
