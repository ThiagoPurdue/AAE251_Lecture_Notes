   <g id="text_1">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(37.584375 33.532594)">“On bumpy days</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(39.587812 46.104188)">half my pictures</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(32.915625 58.507594)">come out blurred.”</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(197.491563 33.539813)">N2: The camera</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(187.710625 45.802594)">images are sharp in</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(198.042813 58.206)">light turbulence.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(353.186563 27.335438)">R2: Image smear</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(350.509063 39.738844)">at survey speed in</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(352.509688 52.14225)">light turbulence is</text>
    <text style="font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(353.848438 64.586625)">at most 0.5 pixel.</text>
   </g>
   <g id="text_4">
    <text style="font-style: italic; font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(15.909375 87.071438)">Customer statement: the</text>
    <text style="font-style: italic; font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(27.7725 99.763688)">pilot's words, written</text>
    <text style="font-style: italic; font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(46.580625 112.455938)">down as said</text>
   </g>
   <g id="text_5">
    <text style="font-style: italic; font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(180.371875 87.071438)">Need statement: what,</text>
    <text style="font-style: italic; font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(179.365 99.763688)">not how; an attribute of</text>
    <text style="font-style: italic; font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(211.391875 112.455938)">the system</text>
   </g>
   <g id="text_6">
    <text style="font-style: italic; font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(340.1825 87.071438)">Requirement: a metric</text>
    <text style="font-style: italic; font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(340.162813 99.763688)">and a value that a test</text>
    <text style="font-style: italic; font-size: 12px; font-family: Arial, Helvetica, sans-serif" transform="translate(372.186875 112.455938)">can check</text>
   </g>
  </g>
 </g>
